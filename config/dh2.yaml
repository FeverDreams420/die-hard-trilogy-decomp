# splat config for DH2.EXE (Phase 7: zero-C matching build).
# Layout from the PS-X EXE header and build/ghidra/DH2.funcs.tsv: code from
# 0x8001D500 to 0x80087F7C (the last BIOS stub, puts, ends with a nop),
# rodata right after, small data (.sdata) from $gp 0x800B61E4, file ends
# 0x800B6D00. No bss in the header.
# The rodata start is not 16-aligned, so sections are not forced to 16.
name: DH2.EXE
sha1: b403d7ed6d529c32cebd24a9faed4874aec74715
options:
  basename: dh2
  base_path: ..
  platform: psx
  compiler: GCC
  target_path: disc/DH2.EXE
  asm_path: asm/dh2
  src_path: src/dh2
  asset_path: build/dh2/assets
  build_path: build
  ld_script_path: build/dh2.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.dh2.txt
  undefined_funcs_auto_path: build/dh2.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/dh2.undefined_syms_auto.txt
  gp_value: 0x800B61E4
  find_file_boundaries: yes
  use_legacy_include_asm: no
  generate_asm_macros_files: no  # include/include_asm.h is ours now
  subalign: 4
  ld_align_section_vram_end: no
  section_order: [".text", ".rodata", ".data", ".sdata", ".bss"]
segments:
  - name: header
    type: header
    start: 0x0
  - name: dh2
    type: code
    start: 0x800
    vram: 0x8001D500
    subsegments:
      - [0x800, c, gun]           # gun library (0x8001D500)
      - [0x1770, c, map]          # game code: credits, map paths (0x8001E470)
      - [0x67D8, c, dh2]          # main game (0x800234D8)
      - [0x5B01C, c, movie]       # movie player and EXE loader (0x80077D1C)
      - [0x5C1E0, c, psyq]         # PsyQ libraries from start (0x80078EE0)
      - [0x6B27C, .rodata, map]
      - [0x6B3E0, .rodata, dh2]      # (0x800880E0)
      - [0x6BDC8, .rodata, movie]    # (0x80088AC8)
      - [0x6BE64, .rodata, psyq]     # PsyQ library strings (0x80088B64)
      - [0x6C808, .data, gun]        # pad library data (0x80089508)
      - [0x6C868, .data, map]        # initialised tables (0x80089568)
      - [0x6CB04, .data, dh2]        # (0x80089804)
      - [0x994E4, .sdata, map]      # small data from $gp (0x800B61E4); tools/sdata_split.py
      - [0x9951C, .sdata, dh2]      # (0x800B621C)
  - [0x9A000]
