# splat config for DH3.EXE (Phase 7: zero-C matching build).
# Layout from the PS-X EXE header and build/ghidra/DH3.funcs.tsv: code from
# 0x8001D500 to 0x80086BD4 (the last BIOS stub, puts, ends with a nop),
# rodata right after, file ends 0x800B5D00. No bss in the header.
# The rodata start is not 16-aligned, so sections are not forced to 16.
name: DH3.EXE
sha1: 2b7b3485205f30ae64702713b726d68d4c6369ea
options:
  basename: dh3
  base_path: ..
  platform: psx
  compiler: GCC
  target_path: disc/DH3.EXE
  asm_path: asm/dh3
  src_path: src/dh3
  asset_path: build/dh3/assets
  build_path: build
  ld_script_path: build/dh3.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbol_addrs.dh3.txt
  undefined_funcs_auto_path: build/dh3.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/dh3.undefined_syms_auto.txt
  gp_value: 0x800B54E4
  find_file_boundaries: yes
  use_legacy_include_asm: no
  generate_asm_macros_files: no  # include/include_asm.h is ours now
  subalign: 4
  ld_align_section_vram_end: no
  section_order: [".text", ".rodata", ".data", ".sdata", ".bss"]
segments:
  - name: header
    type: header
    start: 0x0
  - name: dh3
    type: code
    start: 0x800
    vram: 0x8001D500
    subsegments:
      - [0x800, c, gun]           # gun library (0x8001D500)
      - [0x1770, c, dh3]          # game code (0x8001E470)
      - [0x5B628, c, psyq]         # PsyQ libraries from start (0x80078328)
      - [0x69ED4, .rodata, dh3]
      - [0x987E4, .sdata, dh3]      # small data from $gp (0x800B54E4); tools/sdata_split.py
  - [0x99000]
